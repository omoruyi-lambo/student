<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Deskon Academy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232143FF'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold' font-family='Inter'>D</text></svg>">
</head>
<body>
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">D</div>
        Deskon<span>Academy</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="students.html" class="active">Students</a></li>
        <li><a href="students.html" class="active">Directory</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1 class="fade-in">Student Directory</h1>
      <p class="fade-in">Discover talented students across all tracks</p>
    </div>
  </div>

  <div class="search-filter" id="searchFilter">
    <div class="container">
      <div class="search-filter-inner">
        <div class="search-box">
          <span class="search-icon"><i class="fas fa-search"></i></span>
          <input type="text" id="searchInput" placeholder="Search students by name, track, or skill..." autocomplete="off">
        </div>
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-track="all">All</button>
          <button class="filter-tab" data-track="Frontend Engineering">Frontend</button>
          <button class="filter-tab" data-track="Backend Engineering">Backend</button>
          <button class="filter-tab" data-track="Full Stack Engineering">Full Stack</button>
          <button class="filter-tab" data-track="UI/UX Design">UI/UX</button>
          <button class="filter-tab" data-track="Mobile Development">Mobile</button>
          <button class="filter-tab" data-track="Data Science">Data Science</button>
          <button class="filter-tab" data-track="DevOps Engineering">DevOps</button>
        </div>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div id="resultsCount" style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem"></div>
      <div class="students-grid stagger-children" id="studentsGrid"></div>
      <div id="noResults" class="error-state" style="display:none">
        <h2>No students found</h2>
        <p>Try adjusting your search or filter criteria</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <p>&copy; 2026 Deskon Academy. All rights reserved.</p>
      <div class="footer-links">
        <a href="students.html">Students</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </footer>

  <script src="students.js"></script>
  <script src="script.js"></script>
</body>
</html>
