<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Deskon Academy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2338bdf8'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold' font-family='Arial'>D</text></svg>">
  <link rel="alternate icon" href="logo.png" type="image/png">
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="loader-glow"></div>
      <div class="loader-ring"></div>
      <div class="loader-particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <img src="logo.png" alt="Deskon Academy" class="loader-logo">
    </div>
  </div>
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="logo.png" alt="Deskon Academy" class="logo-img">
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="students.html" class="active">Students</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1 class="fade-in">Student Directory</h1>
      <p class="fade-in">Discover talented students across all tracks</p>
    </div>
  </div>

  <div class="search-filter" id="searchFilter">
    <div class="container">
      <div class="search-filter-inner">
        <div class="search-box">
          <span class="search-icon"><i class="fas fa-search"></i></span>
          <input type="text" id="searchInput" placeholder="Search students by name, track, or skill..." autocomplete="off">
        </div>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div id="resultsCount" style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem"></div>
      <div class="students-grid stagger-children" id="studentsGrid"></div>
      <div id="noResults" class="error-state" style="display:none">
        <h2>No students found</h2>
        <p>Try adjusting your search or filter criteria</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <p>&copy; 2026 Deskon Academy. All rights reserved.</p>
      <div class="footer-links">
        <a href="students.html">Students</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </footer>

  <script src="students.js?v=2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
